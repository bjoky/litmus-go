---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app
  labels:
    app: java-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
      - name: java-app
        image: amazoncorretto:25.0.2
        command:
          - sh
          - -c
          - |
            cat > App.java <<'EOF'
            public class App {
              public static void main(String[] args) throws Exception {
                System.out.println("Java app started");
                while(true) { Thread.sleep(1000); }
              }
            }
            EOF
            javac App.java && java App
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
