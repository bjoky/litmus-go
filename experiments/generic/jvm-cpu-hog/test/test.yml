apiVersion: v1
kind: Pod
metadata:
  name: jvm-cpu-hog
  namespace: default
  labels:
    app: jvm-cpu-hog
spec:
  serviceAccountName: jvm-cpu-hog-sa
  restartPolicy: Never
  containers:
  - name: jvm-cpu-hog
    image: litmuschaos/litmus-go:latest
    imagePullPolicy: Always
    command:
      - ./experiments
      - -name=jvm-cpu-hog
    env:
    - name: TOTAL_CHAOS_DURATION
      value: "60"
    - name: CHAOS_INTERVAL
      value: "10"
    - name: APP_NAMESPACE
      value: "default"
    - name: APP_LABEL
      value: "app=java-app"
    - name: EXPERIMENT_NAME
      value: "jvm-cpu-hog"
    - name: CHAOS_NAMESPACE
      value: "default"
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
